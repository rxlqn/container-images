name: Sync Container Image to GHCR

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: Docker Hub (or other registry) source image, including its tag
        required: true
        default: slimerl/slime:latest
        type: string
      target_image:
        description: Target GHCR image name, without owner or tag
        required: true
        default: slime
        type: string

permissions:
  contents: read
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull source image
        env:
          SOURCE_IMAGE: ${{ inputs.source_image }}
        run: docker pull "$SOURCE_IMAGE"

      - name: Tag image for GHCR
        env:
          SOURCE_IMAGE: ${{ inputs.source_image }}
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.target_image }}:latest
        run: docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"

      - name: Push image to GHCR
        env:
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.target_image }}:latest
        run: docker push "$TARGET_IMAGE"
