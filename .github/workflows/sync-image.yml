name: Sync Docker Image to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image from Docker Hub
        run: docker pull slimerl/slime:latest

      - name: Tag image for GHCR
        run: docker tag slimerl/slime:latest ghcr.io/${{ github.repository_owner }}/slime:latest

      - name: Push image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/slime:latest
